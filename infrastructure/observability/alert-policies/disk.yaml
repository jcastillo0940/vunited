displayName: "Veraguas United - Disco casi lleno"
combiner: OR
conditions:
  - displayName: "Uso de disco > 85% en /"
    conditionThreshold:
      filter: >
        resource.type="gce_instance" AND
        metric.type="agent.googleapis.com/disk/percent_used" AND
        metric.label.state="used" AND
        metric.label.device!="tmpfs"
      comparison: COMPARISON_GT
      thresholdValue: 85
      duration: 300s
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_MEAN
alertStrategy:
  autoClose: 1800s
notificationChannels: []
