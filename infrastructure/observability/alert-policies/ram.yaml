displayName: "Veraguas United - Memoria sostenida alta"
combiner: OR
conditions:
  - displayName: "Uso de memoria > 85% durante 10 minutos"
    conditionThreshold:
      filter: >
        resource.type="gce_instance" AND
        metric.type="agent.googleapis.com/memory/percent_used" AND
        metric.label.state="used"
      comparison: COMPARISON_GT
      thresholdValue: 85
      duration: 600s
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_MEAN
alertStrategy:
  autoClose: 1800s
notificationChannels: []
