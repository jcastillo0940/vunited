openapi: 3.0.3
info:
  title: Veraguas United Payments Internal API
  version: 1.0.0
servers:
  - url: /api/internal/v1
security:
  - serviceAuth: []
paths:
  /payment-intents:
    post:
      operationId: createPaymentIntent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: {'201': {description: Created}, '401': {description: Unauthorized}, '409': {description: Conflict}}
  /payment-intents/{id}:
    get:
      responses: {'200': {description: Payment intent}, '404': {description: Not found}}
  /payment-intents/{id}/cancel:
    post:
      responses: {'200': {description: Cancelled}, '409': {description: Invalid state}}
  /payment-intents/{id}/refunds:
    post:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: {'201': {description: Refund requested}}
  /refunds/{id}:
    get:
      responses: {'200': {description: Refund}}
  /reconciliations:
    get:
      responses: {'200': {description: Reconciliation report}}
components:
  securitySchemes:
    serviceAuth:
      type: apiKey
      in: header
      name: X-Service-Token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 128}
